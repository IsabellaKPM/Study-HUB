name: Tests & Quality Checks

on:
  push:
    branches:
      - feature/*
      - fix/*
      - bugfix/*
      - chore/*
      - refactor/*
      - test/*

  pull_request:
    branches:
      - main
      - dev

  workflow_call:

jobs:
  test-frontend:
    name: Frontend (TS, Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (TypeScript)
        run: pnpm run typecheck:fe

      - name: Linting (ESLint)
        run: pnpm run lint:fe

      - name: Formatting check (Prettier)
        run: pnpm run format:fe:check

  test-backend:
    name: Backend (Rust, Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Rust Formatting (rustfmt)
        run: pnpm run format:be:check

      - name: Clippy Linter
        run: pnpm run lint:be

      - name: Run Rust Tests
        run: pnpm run test:be
