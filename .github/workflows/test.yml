name: Tests & Quality Checks

on:
  push:
    branches:
      - feature/*
      - fix/*
      - bugfix/*
      - chore/*
      - refactor/*
      - test/*

  pull_request:
    branches:
      - main
      - dev

  workflow_call:

jobs:
  test-frontend:
    name: Frontend (TS, Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env

      - run: pnpm run typecheck:fe
      - run: pnpm run lint:fe
      - run: pnpm run format:fe:check

  test-backend:
    name: Backend (Rust, Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - run: pnpm run format:be:check
      - run: pnpm run lint:be
      - run: pnpm run test:be
